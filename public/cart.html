<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart · Demo Shop</title>
  <link rel="stylesheet" href="/css/shop.css">
  <script src="/config.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="logo" href="/">Demo<span>Shop</span></a>
      <nav class="main"><a href="/">Shop</a><a href="/product?id=grinder">Grinders</a><a href="/product?id=kettle">Kettles</a></nav>
      <div class="header-right">
        <span data-account>…</span>
        <a class="cart-link" href="/cart">Cart <span class="badge" data-cart-count>0</span></a>
      </div>
    </div>
  </header>
  <main class="wrap">
    <h1>Your cart</h1>
    <div class="panel">
      <ul class="lines" data-cart></ul>
      <p class="total"><span>Total</span><span data-cart-total>£0.00</span></p>
    </div>
    <p style="margin-top:20px"><a class="btn" href="/checkout" data-go-checkout>Go to checkout</a></p>
  </main>
  <footer class="site"><div class="wrap">A sample store for the Apperio demo project. Nothing here ships.</div></footer>
  <script type="module">
    import { initCart } from "/js/cart-page.js";
    initCart();
  </script>
</body>
</html>
