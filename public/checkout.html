<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Demo Shop</title>
  <link rel="stylesheet" href="/css/shop.css">
  <script src="/config.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="logo" href="/">Demo<span>Shop</span></a>
      <nav class="main"><a href="/">Shop</a><a href="/product?id=grinder">Grinders</a><a href="/product?id=kettle">Kettles</a></nav>
      <div class="header-right">
        <span data-account>…</span>
        <a class="cart-link" href="/cart">Cart <span class="badge" data-cart-count>0</span></a>
      </div>
    </div>
  </header>
  <main class="wrap">
    <h1>Checkout</h1>
    <p class="lead" data-receipt>&nbsp;</p>
    <div class="checkout">
      <form class="panel fields" data-checkout-form>
        <label>Full name <input id="name" name="name" autocomplete="name" required></label>
        <label>Email <input id="email" name="email" type="email" autocomplete="email" required></label>
        <label>Card number <input id="card" name="card" inputmode="numeric" autocomplete="cc-number" required></label>
        <button class="btn" type="submit" data-pay>Pay now</button>
        <p class="status" data-status role="status"></p>
      </form>
      <aside class="panel" data-summary></aside>
    </div>
  </main>
  <footer class="site"><div class="wrap">A sample store for the Apperio demo project. Nothing here ships.</div></footer>
  <script type="module">
    import { initCheckout } from "/js/checkout.js";
    initCheckout();
  </script>
</body>
</html>
